name: Network Configuration CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-network:
    name: Validate Network Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Validate network inventory
        run: python src/validate_network.py

      - name: Generate network inventory report
        run: python src/generate_report.py

      - name: Upload network inventory report
        uses: actions/upload-artifact@v4
        with:
          name: network-inventory-report
          path: reports/network-inventory-report.md
          if-no-files-found: error
          retention-days: 14
